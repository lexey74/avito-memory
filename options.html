<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Avito Memory - База знаний</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f0f0f0;
            font-weight: bold;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .img-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .status-badge {
            font-size: 24px;
        }

        .btn-delete {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #cc0000;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 18px;
        }

        a {
            color: #00AAFF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Avito Memory: Сохраненные записи</h1>

        <div class="controls">
            <button id="refreshBtn" class="refresh-btn">🔄 Обновить</button>

            <div class="filter-group" style="margin-left: 20px; display: inline-flex; align-items: center;">
                <label for="categoryFilter" style="margin-right: 8px;">Категория:</label>
                <select id="categoryFilter" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="">Все</option>
                </select>
            </div>
        </div>

        <table id="recordsTable">
            <thead>
                <tr>
                    <th style="width: 80px;">Фото</th>
                    <th id="sort-title" class="sortable">Название ↕</th>
                    <th id="sort-price" class="sortable" style="width: 100px;">Цена ↕</th>
                    <th>Продавец</th>
                    <th id="sort-status" class="sortable" style="width: 80px;">Статус ↕</th>
                    <th>Категория</th>
                    <th>Комментарий</th>
                    <th style="width: 80px;">Действия</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be injected here -->
            </tbody>
        </table>
        <div id="noData" class="no-data" style="display: none;">Нет сохраненных записей</div>

        <div
            style="margin-top: 30px; text-align: center; color: #999; font-size: 14px; border-top: 1px solid #eee; padding-top: 20px;">
            Нравится расширение? <a href="https://buyacoffee.ru/lexey" target="_blank"
                style="color: #ff9800; font-weight: bold;">Поддержать автора ☕</a>
        </div>
    </div>

    <script src="src/options.js"></script>
</body>

</html>
